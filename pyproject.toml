[project]
name = "y2026"
version = "0.1.0"
description = "Daily automation for the 2026 repository"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3.2",
    "geopandas>=1.0.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pendulum>=3.1.0",
    "pillow>=10.0.0",
    "pygithub>=2.7.0",
    "pytelegrambotapi>=4.28.0",
    "requests>=2.32.4",
    "telegramify-markdown>=0.5.1",
    "terraink-py @ git+https://github.com/yihong0618/terraink_py.git@main",
    "zhconv>=1.4.3",
]

[project.scripts]
get-up = "y2026.get_up:cli"
make-city-video = "y2026.make_video:main"
weekly-tg-summary = "y2026.weekly_tg_summary:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/y2026"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
files = ["src/y2026", "tests"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "black>=25.0.0",
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
